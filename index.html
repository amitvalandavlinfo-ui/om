<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maha Shivratri | Har Har Mahadev</title>
    <!-- Google Fonts for Divine Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Great+Vibes&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">

</head>

<body>

    <audio id="bgMusic" loop>
        <source src="./img/song.mp3" type="audio/mp3">
    </audio>
    <button class="audio-btn" onclick="toggleAudio()">🔇 Enable Sound</button>

    <div class="bg-gradient"></div>
    <canvas id="starfield"></canvas>
    <div class="lightning-overlay" id="lightning"></div>

    <div class="smoke-container">
        <div class="smoke-cloud"></div>
    </div>

    <!-- Divine Rise Glow Effect -->
    <div class="divine-rise-glow"></div>

    <div id="stage">
        <!-- Scene 1: Opening Text -->
        <div id="scene1" class="scene-text">
            <span class="avl-symbol">AVL iNFo</span>
            <span class="om-symbol">ॐ</span>
            <h1 class="main-title">Happy Maha Shivratri</h1>
            <p class="sub-title">Har Har Mahadev</p>
        </div>

        <!-- Scene 2: Divine Reveal -->
        <div id="scene2" class="scene-mahadev">
            <div id="flower-rain-2"></div>

            <div class="divine-aura-base"></div>
            <div class="divine-aura-pulse"></div>
            <div class="head-aura"></div>
            <div class="chakra-rotating"></div>

            <!-- Left Trishul -->
            <svg class="trishul-silhouette trishul-left" viewBox="0 0 100 200" fill="white">
                <path d="M45 180 V100 H55 V180 M30 50 Q30 90 50 90 Q70 90 70 50 M50 90 V20 M50 20 L40 35 M50 20 L60 35"
                    stroke="white" stroke-width="2" fill="none" />
            </svg>

            <!-- Right Trishul -->
            <svg class="trishul-silhouette trishul-right" viewBox="0 0 100 200" fill="white">
                <path d="M45 180 V100 H55 V180 M30 50 Q30 90 50 90 Q70 90 70 50 M50 90 V20 M50 20 L40 35 M50 20 L60 35"
                    stroke="white" stroke-width="2" fill="none" />
            </svg>

            <img src="/img/nandhi.png" alt="Lord Shiva" class="shiva-img">

            <div id="particles-js"></div>
        </div>

        <!-- Scene 3: Divine Reveal -->
        <div id="scene3" class="scene-mahadev">
            <div id="flower-rain-3"></div>

            <div class="divine-aura-base"></div>
            <div class="divine-aura-pulse"></div>
            <div class="head-aura"></div>
            <div class="chakra-rotating"></div>

            <!-- Left Trishul -->
            <svg class="trishul-silhouette trishul-left" viewBox="0 0 100 200" fill="white">
                <path d="M45 180 V100 H55 V180 M30 50 Q30 90 50 90 Q70 90 70 50 M50 90 V20 M50 20 L40 35 M50 20 L60 35"
                    stroke="white" stroke-width="2" fill="none" />
            </svg>

            <!-- Right Trishul -->
            <svg class="trishul-silhouette trishul-right" viewBox="0 0 100 200" fill="white">
                <path d="M45 180 V100 H55 V180 M30 50 Q30 90 50 90 Q70 90 70 50 M50 90 V20 M50 20 L40 35 M50 20 L60 35"
                    stroke="white" stroke-width="2" fill="none" />
            </svg>

            <img src="/img/shivji.png" alt="Lord Shiva" class="shiva-img">

            <div id="particles-js"></div>
        </div>
    </div>

    <script>
        /* --- STARFIELD ANIMATION --- */
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let width, height;
        let stars = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        class Star {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2;
                this.alpha = Math.random();
                this.speed = Math.random() * 0.05 + 0.01;
                this.growing = Math.random() > 0.5;
            }
            update() {
                this.y -= this.speed;
                if (this.y < 0) this.reset();
                if (this.growing) {
                    this.alpha += 0.01;
                    if (this.alpha >= 1) this.growing = false;
                } else {
                    this.alpha -= 0.01;
                    if (this.alpha <= 0.2) this.growing = true;
                }
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initStars() {
            resize();
            for (let i = 0; i < 150; i++) stars.push(new Star());
            animateStars();
        }

        function animateStars() {
            ctx.clearRect(0, 0, width, height);
            stars.forEach(star => { star.update(); star.draw(); });
            requestAnimationFrame(animateStars);
        }

        window.addEventListener('resize', resize);
        initStars();

        /* --- FLOWER RAIN SYSTEM --- */
        const flowerColors = ['#ffc0cb', '#ffa500', '#ffffff', '#ffd700']; // Pink, Saffron, White, Gold


        function createPetal(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;

            const petal = document.createElement('div');
            petal.classList.add('petal');

            const side = Math.random() > 0.5 ? 'left' : 'right';
            const size = Math.random() * 10 + 10;
            const color = flowerColors[Math.floor(Math.random() * flowerColors.length)];

            petal.style.width = `${size}px`;
            petal.style.height = `${size * 0.8}px`;
            petal.style.backgroundColor = color;
            petal.style.borderRadius = '50% 0 50% 50%';
            petal.style.boxShadow = `0 0 5px ${color}88`;

            if (side === 'left') {
                petal.style.left = `-${Math.random() * 5}%`;
                petal.style.top = `${Math.random() * 40}%`;
                petal.style.animation = `petalFallLeft ${Math.random() * 4 + 4}s linear forwards`;
            } else {
                petal.style.right = `-${Math.random() * 5}%`;
                petal.style.top = `${Math.random() * 40}%`;
                petal.style.animation = `petalFallRight ${Math.random() * 4 + 4}s linear forwards`;
            }

            container.appendChild(petal);
            setTimeout(() => petal.remove(), 8000);
        }

        function startFlowerRain(containerId) {
            setInterval(() => createPetal(containerId), 400);
        }



        /* --- SCENE ORCHESTRATION --- */
        const scene1 = document.getElementById('scene1');
        const scene2 = document.getElementById('scene2');
        const scene3 = document.getElementById('scene3');
        const lightning = document.getElementById('lightning');

        function startExperience() {
            scene1.classList.add('animate-text-in');

            setTimeout(() => {
                scene1.classList.remove('animate-text-in');
                scene1.classList.add('animate-text-out');
            }, 5000);

            setTimeout(() => {
                scene2.classList.add('animate-mahadev-in');
                startParticles();
                triggerRandomLightning();
                startFlowerRain('flower-rain-2');
            }, 6000);

            setTimeout(() => {
                scene2.classList.add('hide-scene');
                scene3.classList.add('animate-mahadev-in');
                startParticles();
                triggerRandomLightning();
                startFlowerRain('flower-rain-3');
            }, 11500);
        }

        function triggerRandomLightning() {
            const delay = Math.random() * 6000 + 3000;
            lightning.classList.remove('trigger-lightning');
            void lightning.offsetWidth;
            lightning.classList.add('trigger-lightning');
            setTimeout(triggerRandomLightning, delay);
        }

        function startParticles() {
            const container = document.getElementById('particles-js');
            setInterval(() => {
                const p = document.createElement('div');
                p.classList.add('particle');
                const size = Math.random() * 3 + 1.5;
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                p.style.left = `${Math.random() * 100}%`;
                p.style.bottom = '10%';
                p.style.opacity = Math.random();
                const duration = Math.random() * 4 + 3;
                p.style.animation = `particleFloat ${duration}s linear forwards`;
                container.appendChild(p);
                setTimeout(() => p.remove(), duration * 1000);
            }, 300);
        }

        /* --- AUDIO --- */
        // const audio = document.getElementById('bgMusic');
        // const btn = document.querySelector('.audio-btn');
        // let isPlaying = false;

        // function toggleAudio() {
        //     if (!isPlaying) {
        //         audio.play().then(() => {
        //             isPlaying = true;
        //             btn.textContent = "🔊 Sound On";
        //         }).catch(e => console.log(e));
        //     } else {
        //         audio.pause();
        //         isPlaying = false;
        //         btn.textContent = "🔇 Enable Sound";
        //     }
        // }

        const audio = document.getElementById('bgMusic');
        const btn = document.querySelector('.audio-btn');
        let isPlaying = false;

        // AUTO PLAY ON FIRST USER INTERACTION
        function autoPlayOnce() {
            audio.play().then(() => {
                isPlaying = true;
                btn.textContent = "🔊 Sound On";
                document.removeEventListener('click', autoPlayOnce);
            }).catch(err => console.log("Autoplay blocked:", err));
        }

        // page pe kahin bhi click ho
        document.addEventListener('click', autoPlayOnce);

        // manual toggle bhi rahe
        function toggleAudio() {
            if (!isPlaying) {
                audio.play();
                isPlaying = true;
                btn.textContent = "🔊 Sound On";
            } else {
                audio.pause();
                isPlaying = false;
                btn.textContent = "🔇 Enable Sound";
            }
        }


        window.onload = startExperience;
    </script>
</body>

</html>
